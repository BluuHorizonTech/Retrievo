<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Retrievo — AI Retrieval System</title>

    <!-- Markdown Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Modern Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0f0f;
            color: #e6e6e6;

            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* important */
        }

        header {
            padding: 18px 30px;
            border-bottom: 1px solid #222;
            font-size: 18px;
            font-weight: 600;
        }

        /* Main chat wrapper */
        #chat {
            flex: 1;
            overflow-y: auto;
            /* enables scrolling */
            padding: 30px 0;

            display: flex;
            flex-direction: column;

            align-items: center;
            /* center messages horizontally */
        }

        .chat-inner {
            width: 100%;
            max-width: 850px;
            padding: 0 30px;
        }

        .message {
            margin-bottom: 30px;
            line-height: 1.8;
            font-size: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .user {
            text-align: right;
            color: #8ab4f8;
        }

        .bot {
            color: #ddd;
        }

        .bot strong {
            font-weight: 600;
        }

        .bot code {
            background: #1e1e1e;
            padding: 3px 6px;
            border-radius: 6px;
            font-family: monospace;
        }

        .bot pre {
            background: #1b1b1b;
            padding: 12px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .context {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            border-left: 2px solid #333;
            padding-left: 10px;
        }

        #input-area {
            display: flex;
            padding: 20px;
            border-top: 1px solid #222;
            max-width: 850px;
            margin: auto;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px;
            background: #1c1c1c;
            border: 1px solid #333;
            color: white;
            font-size: 14px;
            border-radius: 8px;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 14px 20px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
        }

        button:hover {
            background: #1d4ed8;
        }

        .typing::after {
            content: "|";
            margin-left: 2px;
            color: #aaa;
            animation: blink 1s steps(2, start) infinite;
        }

        @keyframes blink {
            to {
                visibility: hidden;
            }
        }

        #upload-section {
            max-width: 850px;
            margin: 30px auto 0 auto;
            width: 100%;
        }

        #dropZone {
            border: 2px dashed #333;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            background: #141414;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #dropZone:hover {
            border-color: #2563eb;
            background: #181818;
        }

        #dropText {
            font-size: 14px;
            color: #aaa;
        }

        #dropText span {
            font-size: 12px;
            color: #666;
        }

        #fileName {
            margin-top: 10px;
            font-size: 13px;
            color: #4ade80;
        }

        /* Smooth premium scrollbar */
        #chat::-webkit-scrollbar {
            width: 10px;
        }

        #chat::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg,
                    #2a2a2a,
                    #1f1f1f);
            border-radius: 20px;
            border: 2px solid #0f0f0f;
        }

        #chat::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg,
                    #3b82f6,
                    #2563eb);
        }

        .spinner {
            margin-top: 15px;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: auto;
            margin-right: auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           RETRIEVO AI VISUAL SYSTEM
           ========================= */

        body {
            background:
                radial-gradient(circle at 50% -20%, rgba(37, 99, 235, .16), transparent 34%),
                radial-gradient(circle at 90% 70%, rgba(124, 58, 237, .08), transparent 30%),
                #07090d;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 42px 42px;
            mask-image: linear-gradient(to bottom, black, transparent 88%);
            z-index: 0;
        }

        .topbar {
            position: relative;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 28px;
            border-bottom: 1px solid rgba(100, 130, 180, .16);
            background: rgba(7, 9, 13, .78);
            backdrop-filter: blur(18px);
            box-shadow: 0 8px 30px rgba(0,0,0,.18);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            position: relative;
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
        }

        .brand-mark img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(37, 148, 255, .42));
            animation: logoBreath 3.5s ease-in-out infinite;
        }

        .brand-orbit {
            position: absolute;
            inset: 1px;
            border: 1px solid rgba(59,130,246,.24);
            border-radius: 50%;
            pointer-events: none;
        }

        .orbit-1 {
            animation: orbitSpin 8s linear infinite;
            border-top-color: rgba(59,130,246,.85);
        }

        .orbit-2 {
            inset: 7px;
            border-bottom-color: rgba(139,92,246,.75);
            animation: orbitSpinReverse 5s linear infinite;
        }

        .brand-copy {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -.7px;
            background: linear-gradient(100deg, #f5f8ff 20%, #60a5fa 62%, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand-subtitle {
            font-size: 10px;
            color: #69758a;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin-right: 5px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px rgba(74,222,128,.9);
            animation: statusPulse 1.8s ease-in-out infinite;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 11px;
            border: 1px solid rgba(74,222,128,.15);
            border-radius: 999px;
            background: rgba(74,222,128,.035);
            color: #6ee7a0;
            font-size: 9px;
            letter-spacing: 1.5px;
        }

        .pulse-ring {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 0 rgba(74,222,128,.7);
            animation: ringPulse 1.8s infinite;
        }

        .ai-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            opacity: .32;
            background-image:
                linear-gradient(rgba(59,130,246,.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,.035) 1px, transparent 1px);
            background-size: 80px 80px;
            transform: perspective(600px) rotateX(55deg) scale(1.5);
            transform-origin: 50% 100%;
            animation: gridDrift 14s linear infinite;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,.5), rgba(139,92,246,.35), transparent);
            box-shadow: 0 0 18px rgba(59,130,246,.28);
            animation: scan 7s ease-in-out infinite;
            opacity: .5;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            opacity: .12;
        }

        .orb-a {
            width: 300px; height: 300px;
            left: -130px; top: 35%;
            background: #2563eb;
            animation: floatA 11s ease-in-out infinite;
        }

        .orb-b {
            width: 260px; height: 260px;
            right: -100px; top: 20%;
            background: #7c3aed;
            animation: floatB 13s ease-in-out infinite;
        }

        .orb-c {
            width: 180px; height: 180px;
            left: 42%; bottom: -100px;
            background: #06b6d4;
            animation: floatC 9s ease-in-out infinite;
        }

        .neural {
            position: absolute;
            width: 260px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59,130,246,.24), transparent);
            transform-origin: left;
            opacity: .7;
        }

        .neural-1 { top: 26%; left: 4%; transform: rotate(22deg); animation: neuralPulse 4s infinite; }
        .neural-2 { top: 62%; right: 3%; transform: rotate(-25deg); animation: neuralPulse 5s .8s infinite; }
        .neural-3 { bottom: 18%; left: 28%; transform: rotate(-8deg); animation: neuralPulse 4.5s 1.4s infinite; }

        #upload-section, #chat, #input-area,

        #upload-section {
            margin-top: 20px;
        }

        #dropZone {
            position: relative;
            overflow: hidden;
            border: 1px dashed rgba(78, 120, 190, .32);
            background: linear-gradient(135deg, rgba(17,24,39,.82), rgba(9,13,21,.9));
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,.025),
                0 12px 50px rgba(0,0,0,.2);
            transition: border-color .35s, transform .35s, box-shadow .35s;
        }

        #dropZone:hover,
        #dropZone.drag-active {
            border-color: rgba(59,130,246,.8);
            transform: translateY(-2px);
            box-shadow:
                0 0 0 1px rgba(59,130,246,.08),
                0 0 35px rgba(37,99,235,.12),
                0 18px 60px rgba(0,0,0,.25);
        }

        .upload-glow {
            position: absolute;
            width: 160px;
            height: 160px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(37,99,235,.16), transparent 68%);
            animation: uploadGlow 3s ease-in-out infinite;
        }

        .upload-icon {
            position: relative;
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(59,130,246,.3);
            border-radius: 15px;
            background: rgba(37,99,235,.06);
            box-shadow: 0 0 24px rgba(37,99,235,.1);
        }

        .upload-icon-core {
            color: #60a5fa;
            font-size: 25px;
            animation: uploadFloat 2s ease-in-out infinite;
        }

        .upload-radar {
            position: absolute;
            inset: -7px;
            border: 1px solid rgba(59,130,246,.14);
            border-radius: 18px;
            animation: radarPulse 2.5s infinite;
        }

        #dropText strong {
            color: #dbeafe;
            font-weight: 600;
            font-size: 14px;
        }

        .upload-hint {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 17px;
            font-size: 8px;
            color: #526079;
            letter-spacing: 1.5px;
        }

        .upload-hint i {
            width: 20px;
            height: 1px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            opacity: .6;
        }

        #input-area {
            border-top-color: rgba(100,130,180,.13);
            background: rgba(7,9,13,.72);
            backdrop-filter: blur(16px);
        }

        input[type="text"] {
            border-color: rgba(100,130,180,.18);
            background: rgba(15,20,29,.82);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
            transition: border-color .25s, box-shadow .25s;
        }

        input[type="text"]:focus {
            border-color: rgba(59,130,246,.55);
            box-shadow: 0 0 0 3px rgba(59,130,246,.06), 0 0 22px rgba(37,99,235,.08);
        }

        button {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            box-shadow: 0 5px 20px rgba(37,99,235,.18);
            transition: transform .2s, box-shadow .2s, filter .2s;
        }

        button:hover {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            transform: translateY(-1px);
            box-shadow: 0 8px 26px rgba(37,99,235,.28);
            filter: saturate(1.1);
        }

        .message {
            position: relative;
        }

        .bot::before {
            content: "R";
            position: absolute;
            left: -29px;
            top: 2px;
            width: 20px;
            height: 20px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            color: #60a5fa;
            background: rgba(37,99,235,.08);
            border: 1px solid rgba(59,130,246,.16);
            font-size: 10px;
            font-weight: 800;
            box-shadow: 0 0 12px rgba(37,99,235,.08);
        }

        @keyframes logoBreath {
            0%,100% { transform: scale(1); filter: drop-shadow(0 0 9px rgba(37,148,255,.35)); }
            50% { transform: scale(1.045); filter: drop-shadow(0 0 18px rgba(37,148,255,.65)); }
        }

        @keyframes orbitSpin { to { transform: rotate(360deg); } }
        @keyframes orbitSpinReverse { to { transform: rotate(-360deg); } }
        @keyframes statusPulse {
            0%,100% { opacity: .6; transform: scale(.9); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        @keyframes ringPulse {
            0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); }
            70% { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
            100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
        }
        @keyframes gridDrift {
            from { transform: perspective(600px) rotateX(55deg) scale(1.5) translateY(0); }
            to { transform: perspective(600px) rotateX(55deg) scale(1.5) translateY(80px); }
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            15% { opacity: .55; }
            50% { opacity: .28; }
            100% { top: 92%; opacity: 0; }
        }
        @keyframes floatA { 50% { transform: translate(70px,-40px) scale(1.15); } }
        @keyframes floatB { 50% { transform: translate(-60px,55px) scale(.85); } }
        @keyframes floatC { 50% { transform: translate(40px,-35px) scale(1.2); } }
        @keyframes neuralPulse {
            0%,100% { opacity: .15; transform-origin: left; }
            50% { opacity: .7; filter: drop-shadow(0 0 5px rgba(59,130,246,.4)); }
        }
        @keyframes consoleScan {
            0% { transform: translateY(-10px); opacity: 0; }
            30%,70% { opacity: 1; }
            100% { transform: translateY(35px); opacity: 0; }
        }
        @keyframes uploadGlow {
            0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.8); }
            50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
        }
        @keyframes uploadFloat {
            0%,100% { transform: translateY(2px); }
            50% { transform: translateY(-4px); }
        }
        @keyframes radarPulse {
            0% { transform: scale(.85); opacity: .65; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        @media (max-width: 600px) {
            .topbar { padding: 10px 16px; }
            .system-status { display: none; }
            .ai-console,
            #upload-section { width: calc(100% - 30px); }
            #input-area { padding: 12px 15px; }
            .bot::before { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

        @media (max-width: 600px) {
            .thinking-indicator { width: calc(100% - 30px); }
        }


        /* Single assistant state: Thinking -> streamed answer */
        .assistant-thinking {
            color: #68778e;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
        }

        .assistant-thinking .thinking-symbol {
            color: #60a5fa;
            animation: thinkingPulse 1.2s ease-in-out infinite;
        }

        .assistant-cursor {
            display: inline-block;
            margin-left: 2px;
            color: #60a5fa;
            animation: blink .72s steps(2, start) infinite;
        }

        .message.bot.streaming {
            min-height: 22px;
        }

        .message.bot.streaming::after {
            display: none;
        }

        @keyframes thinkingPulse {
            0%, 100% { opacity: .35; transform: scale(.85); }
            50% { opacity: 1; transform: scale(1.15); }
        }

    </style>
</head>

            <div class="brand-copy">

            <span class="pulse-ring"></span>

    </header>

    <div class="ai-background" aria-hidden="true">
        <div class="grid-overlay"></div>
        <div class="scan-line"></div>
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="neural neural-1"></div>
        <div class="neural neural-2"></div>
        <div class="neural neural-3"></div>
        <div class="particle-field" id="particleField"></div>
    </div>

    <div id="upload-section">
        <div id="dropZone">
            <div class="upload-glow"></div>
            <div id="uploadSpinner" class="spinner" style="display:none;"></div>
            <div class="upload-icon">
                <div class="upload-icon-core">↥</div>
                <div class="upload-radar"></div>
            </div>
            <div id="dropText">
                <strong>Feed Retrievo a document</strong>
                <br>
                <span>Drop a file here or click to initialize ingestion</span>
            </div>
            <input type="file" id="fileInput" hidden />
            <div id="fileName"></div>
            <div class="upload-hint">
                <span>FEED</span>
                <i></i>
                <span>LEARN</span>
                <i></i>
                <span>RESPONSE</span>
            </div>
        </div>
    </div>

    <div id="chat">
        <div class="chat-inner" id="chatInner"></div>
    </div>
<div id="input-area">
        <input type="text" id="questionInput" placeholder="Ask something about your document...">
        <button onclick="askQuestion()">Send</button>
    </div>

    <script>

        // Each browser gets a unique session
        const sessionId = localStorage.getItem("session_id") || crypto.randomUUID();
        localStorage.setItem("session_id", sessionId);

        const backendURL = "http://localhost:5000";

        function addMessage(text, sender, context = null) {
            const chat = document.getElementById("chatInner");

            const msg = document.createElement("div");
            msg.className = "message " + sender;
            msg.innerHTML = text;

            if (context) {
                const ctx = document.createElement("div");
                ctx.className = "context";
                ctx.innerText = "Retrieved Context: " + context.join(" | ");
                msg.appendChild(ctx);
            }

            chat.appendChild(msg);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById("questionInput")
            .addEventListener("keydown", function (e) {
                if (e.key === "Enter") {
                    e.preventDefault();
                    askQuestion();
                }
            });

        async function uploadFile() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a file");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            await fetch(backendURL + "/upload", {
                method: "POST",
                body: formData
            });

            alert("Document uploaded & processed!");
        }

        // Handle drag and drop zone
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const fileNameDisplay = document.getElementById("fileName");

        // Click to open file chooser
        dropZone.addEventListener("click", () => {
            fileInput.click();
        });

        // Handle manual selection
        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            await uploadFile(file);
        });

        // Drag over styling
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#2563eb";
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.style.borderColor = "#333";
        });

        // Handle drop
        dropZone.addEventListener("drop", async (e) => {
            e.preventDefault();
            dropZone.style.borderColor = "#333";

            const file = e.dataTransfer.files[0];
            await uploadFile(file);
        });

        // Upload function
        async function uploadFile(file) {
            const spinner = document.getElementById("uploadSpinner");
            spinner.style.display = "block";

            const formData = new FormData();
            formData.append("file", file);

            await fetch(backendURL + "/upload", {
                method: "POST",
                body: formData
            });

            spinner.style.display = "none";
            fileNameDisplay.innerText = "◉ Indexed: " + file.name;
}

        async function askQuestion() {
            const input = document.getElementById("questionInput");
            const question = input.value.trim();

            if (!question) return;

            addMessage(question, "user");
            input.value = "";
            input.disabled = true;

            const chat = document.getElementById("chatInner");

            // ONE assistant message only.
            // It starts as Thinking| and becomes the streamed answer.
            const botMessage = document.createElement("div");
            botMessage.className = "message bot streaming";
            botMessage.innerHTML = `
                <span class="assistant-thinking">
                    <span class="thinking-symbol">✦</span>
                    <span>Thinking</span>
                    <span class="assistant-cursor">|</span>
                </span>
            `;
            chat.appendChild(botMessage);

            const scrollChat = () => {
                const container = document.getElementById("chat");
                container.scrollTop = container.scrollHeight;
            };

            scrollChat();

            try {
                const response = await fetch(backendURL + "/ask", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        question: question,
                        session_id: sessionId
                    })
                });

                if (!response.ok || !response.body) {
                    throw new Error("Request failed");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                let pending = "";
                let displayedText = "";
                let firstChunk = true;

                // Keep "Thinking|" visible until actual backend data arrives.
                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });

                    if (!chunk) continue;

                    if (firstChunk) {
                        firstChunk = false;
                        // Replace Thinking| with the actual answer.
                        botMessage.innerHTML = "";
                    }

                    pending += chunk;

                    while (pending.length > 0) {
                        const take = pending.startsWith("\n") ? 1 : 2;

                        displayedText += pending.slice(0, take);
                        pending = pending.slice(take);

                        botMessage.innerHTML =
                            marked.parse(displayedText) +
                            '<span class="assistant-cursor">|</span>';

                        scrollChat();

                        await new Promise(resolve =>
                            setTimeout(resolve, displayedText.endsWith("\n") ? 35 : 16)
                        );
                    }
                }

                // Flush any remaining decoder bytes.
                pending += decoder.decode();

                while (pending.length > 0) {
                    displayedText += pending.slice(0, 2);
                    pending = pending.slice(2);

                    botMessage.innerHTML =
                        marked.parse(displayedText) +
                        '<span class="assistant-cursor">|</span>';

                    scrollChat();

                    await new Promise(resolve => setTimeout(resolve, 16));
                }

                // Leave the final answer clean.
                botMessage.innerHTML = marked.parse(displayedText);
                botMessage.classList.remove("streaming");
                botMessage.classList.add("response-glow");

                scrollChat();

            } catch (error) {
                botMessage.classList.remove("streaming");
                botMessage.innerHTML =
                    "I couldn't complete that request. Please try again.";
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        // Retrievo visual system: lightweight ambient particles.
        const particleField = document.getElementById("particleField");
        if (particleField) {
            for (let i = 0; i < 28; i++) {
                const p = document.createElement("span");
                p.style.cssText = `
                    position:absolute;
                    width:${Math.random() * 2 + 1}px;
                    height:${Math.random() * 2 + 1}px;
                    left:${Math.random() * 100}%;
                    top:${Math.random() * 100}%;
                    border-radius:50%;
                    background:rgba(96,165,250,${Math.random() * .35 + .1});
                    box-shadow:0 0 8px rgba(59,130,246,.25);
                    animation: particleFloat ${Math.random() * 8 + 7}s ${Math.random() * -8}s ease-in-out infinite;
                `;
                particleField.appendChild(p);
            }
        }

        const particleStyle = document.createElement("style");
        particleStyle.textContent = `
            @keyframes particleFloat {
                0%,100% { transform: translate3d(0,0,0); opacity:.15; }
                25% { transform: translate3d(12px,-22px,0); opacity:.7; }
                50% { transform: translate3d(-8px,-45px,0); opacity:.25; }
                75% { transform: translate3d(20px,-15px,0); opacity:.55; }
            }
        `;
        document.head.appendChild(particleStyle);

        // Better drag/drop visual state.
        dropZone.addEventListener("dragenter", (e) => {
            e.preventDefault();
            dropZone.classList.add("drag-active");
        });
        dropZone.addEventListener("dragleave", (e) => {
            if (!dropZone.contains(e.relatedTarget)) dropZone.classList.remove("drag-active");
        });
        dropZone.addEventListener("drop", () => dropZone.classList.remove("drag-active"));

    </script>
